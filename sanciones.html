<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SAM - Sanction and Adverse Media</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="https://holdingsbpo.com/main/assets/img/Favicon-2.png" />
  <link rel="stylesheet" href="./css/sanciones.css" />
</head>
<body>

  <!-- Flecha de regreso -->
  <a href="index.html" class="back-button">
    <svg xmlns="http://www.w3.org/2000/svg" class="back-icon" viewBox="0 0 24 24" fill="none" stroke="#2ea3f2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
    Back
  </a>

  <div class="noise"></div>
  <div class="circle"></div>
  <div class="circle small"></div>

  <img src="assets/images/sammy.png" class="sammy bounce" id="sammy" alt="Sammy" />

  <!-- Trivia -->
  <div class="trivia-box" id="trivia-box">
    <div class="trivia-title">💼 Compliance Trivia</div>
    <div class="trivia-question" id="trivia-question">Loading question...</div>
    <div class="trivia-options" id="trivia-options"></div>
    <div class="trivia-feedback" id="trivia-feedback"></div>
  </div>

  <!-- Chat -->
  <div class="chat-box" id="chat-box">
    <div class="chat-header">
      Sammy
      <button class="close-btn" onclick="minimizeChat()">✖</button>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input">
      <input type="text" id="user-input" placeholder="¿En qué puedo ayudarte?" />
      <button onclick="sendMessage()">Enviar</button>
    </div>
  </div>

  <!-- JS -->
  <script>
    const sammy = document.getElementById('sammy');
    const chatBox = document.getElementById('chat-box');
    const input = document.getElementById('user-input');
    const messages = document.getElementById('chat-messages');
    const triviaBox = document.getElementById('trivia-box');

    let hasWelcomed = false;

    setInterval(() => {
      sammy.classList.toggle('bounce');
    }, 15000);

    sammy.addEventListener('click', () => {
      chatBox.classList.toggle('active');
      if (chatBox.classList.contains('active') && !hasWelcomed) {
        setTimeout(() => {
          messages.innerHTML += `
          <div class="message bot">
            <img src="assets/images/sammy_head.png" alt="Sammy cabeza" />
            <div class="bubble">El cumplimiento nos llama, dime cómo puedo ayudarte el día de hoy.</div>
          </div>`;
          messages.scrollTop = messages.scrollHeight;
          hasWelcomed = true;
        }, 500);
      }
    });

    function minimizeChat() {
      chatBox.classList.remove('active');
    }

    function sendMessage() {
      const userText = input.value.trim();
      if (!userText) return;
      
      // Add user message
      messages.innerHTML += `<div class="message user"><div class="bubble">${userText}</div></div>`;
      messages.scrollTop = messages.scrollHeight;
      input.value = "";

      // Add loader message
      const loaderId = 'loader-' + Date.now();
      messages.innerHTML += `
        <div class="message bot" id="${loaderId}">
          <img src="assets/images/sammy_head.png" />
          <div class="bubble">
            <div class="typing-indicator">
              <span></span>
              <span></span>
              <span></span>
            </div>
            Sammy está pensando...
          </div>
        </div>`;
      messages.scrollTop = messages.scrollHeight;

      fetch('https://sammyagentbackend.up.railway.app/ask', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ message: userText })
      })
      .then(response => {
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        return response.json();
      })
      .then(data => {
        const loaderElement = document.getElementById(loaderId);
        if (loaderElement) {
          loaderElement.remove();
        }
        
        const botResponse = data.response || data.message || 'Lo siento, no pude procesar tu solicitud.';
        messages.innerHTML += `
          <div class="message bot">
            <img src="assets/images/sammy_head.png" />
            <div class="bubble">${botResponse}</div>
          </div>`;
        messages.scrollTop = messages.scrollHeight;
      })
      .catch(error => {
        console.error('Error:', error);
        
        const loaderElement = document.getElementById(loaderId);
        if (loaderElement) {
          loaderElement.remove();
        }
        
        messages.innerHTML += `
          <div class="message bot">
            <img src="assets/images/sammy_head.png" />
            <div class="bubble">Lo siento, ocurrió un error al procesar tu solicitud. Por favor, intenta de nuevo.</div>
          </div>`;
        messages.scrollTop = messages.scrollHeight;
      });
    }

    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") sendMessage();
    });

    const triviaData = [
      {
        question: "What is the primary goal of Anti-Money Laundering (AML) regulations?",
        options: { A: "Protect client data", B: "Prevent financial crimes", C: "Monitor employees" },
        answer: "B"
      },
      {
        question: "Which agency enforces the FCPA?",
        options: { A: "FBI", B: "FinCEN", C: "SEC" },
        answer: "C"
      },
      {
        question: "Which of these is a compliance red flag?",
        options: { A: "Consistent reports", B: "Large round transactions", C: "Audits" },
        answer: "B"
      }
    ];

    let currentTrivia = 0;

    function loadTrivia() {
      const trivia = triviaData[currentTrivia];
      document.getElementById("trivia-question").textContent = trivia.question;
      const optionsBox = document.getElementById("trivia-options");
      const feedback = document.getElementById("trivia-feedback");
      feedback.textContent = "";
      optionsBox.innerHTML = "";
      for (let key in trivia.options) {
        const btn = document.createElement("button");
        btn.textContent = `${key}. ${trivia.options[key]}`;
        btn.onclick = () => {
          feedback.textContent = (key === trivia.answer) ? "✅ Correct!" : "❌ Not quite.";
        };
        optionsBox.appendChild(btn);
      }
      currentTrivia = (currentTrivia + 1) % triviaData.length;
    }

    loadTrivia();
    setInterval(loadTrivia, 30000);

    function makeDraggable(box) {
      let posX = 0, posY = 0, mouseX = 0, mouseY = 0;
      box.onmousedown = function(e) {
        if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "BUTTON") return;
        e.preventDefault();
        mouseX = e.clientX;
        mouseY = e.clientY;
        document.onmouseup = closeDrag;
        document.onmousemove = drag;
      };
      function drag(e) {
        posX = mouseX - e.clientX;
        posY = mouseY - e.clientY;
        mouseX = e.clientX;
        mouseY = e.clientY;
        box.style.top = (box.offsetTop - posY) + "px";
        box.style.left = (box.offsetLeft - posX) + "px";
      }
      function closeDrag() {
        document.onmouseup = null;
        document.onmousemove = null;
      }
    }

    makeDraggable(chatBox);
    makeDraggable(triviaBox);
  </script>
</body>
</html>
