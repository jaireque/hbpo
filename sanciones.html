<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SAM - Sanction and Adverse Media</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="https://holdingsbpo.com/main/assets/img/Favicon-2.png" />
  <link rel="stylesheet" href="./css/sanciones.css" />
</head>
<body>

  <!-- Flecha de regreso -->
  <a href="index.html" class="back-button">
    <svg xmlns="http://www.w3.org/2000/svg" class="back-icon" viewBox="0 0 24 24" fill="none" stroke="#2ea3f2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
    Back
  </a>

  <div class="noise"></div>
  <div class="circle"></div>
  <div class="circle small"></div>

  <img src="assets/images/sammy.png" class="sammy bounce" id="sammy" alt="Sammy" />

  <!-- Trivia -->
  <div class="trivia-box" id="trivia-box">
    <div class="trivia-title">💼 Compliance Trivia</div>
    <div class="trivia-question" id="trivia-question">Loading question...</div>
    <div class="trivia-options" id="trivia-options"></div>
    <div class="trivia-feedback" id="trivia-feedback"></div>
  </div>

  <!-- Chat -->
  <div class="chat-box" id="chat-box">
    <div class="chat-header">
      Sammy
      <button class="close-btn" onclick="minimizeChat()">✖</button>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input">
      <input type="file" id="file-input" accept=".pdf,.doc,.docx,.txt,.jpg,.jpeg,.png" style="display: none;" />
      <button type="button" class="attach-btn" onclick="document.getElementById('file-input').click()" title="Attach file">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <input type="text" id="user-input" placeholder="¿En qué puedo ayudarte?" />
      <button onclick="sendMessage()">Enviar</button>
    </div>
    <div class="file-preview" id="file-preview" style="display: none;"></div>
  </div>

  <script src="./js/sanciones.js"></script>
</body>
</html>
